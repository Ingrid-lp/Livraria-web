<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Livraria</title>
</head>
<body>
    
    <legend>Contate-nos</legend>

    <form action="#" method="POST">
    <fieldset>
        
        <legend>Contate-nos</legend>

        <p>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
        </p>
        
        <p>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="(dd) 99999-9999">
        </p>
       
        <p>
            <label for="assunto">Assunto:</label><br>
            <select id="assunto" name="assunto" required>
                <option value="" disabled selected>Selecione</option>
                <option value="trocas">Trocas</option>
                <option value="atendimento">Atendimento</option>
                <option value="comercial">Comercial</option>
                <option value="outros">Outros</option>
            </select>
        </p>

        <p>
            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui a sua mensagem" required></textarea>
        </p>

        <p>
            <label>
                <input type="checkbox" name="newsletter" value="sim">
                Desejo receber informações sobre a Livraria John e Paul
            </label>
        </p>

        <p>
            <button type="submit">Enviar Formulário</button>
            <button type="reset">Limpar Campos</button>
        </p>
    </fieldset>
</form>

</body>
</html>
